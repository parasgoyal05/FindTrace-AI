<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Detection - Missing Person Detection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .nav {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            text-align: center;
        }

        .nav a {
            color: #667eea;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav a:hover {
            background: #e9ecef;
        }

        .content {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        #imageCanvas {
            width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .message.show {
            display: block;
        }

        .matches-container {
            max-height: 500px;
            overflow-y: auto;
        }

        .match-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid #28a745;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .match-item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .match-item .confidence {
            font-size: 1.2em;
            color: #28a745;
            font-weight: bold;
            margin: 10px 0;
        }

        .match-item .details {
            color: #666;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .detection-summary {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            color: #495057;
        }

        .multiple-persons-alert {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 3px solid #ff4757;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .multiple-persons-alert h3 {
            margin: 0 0 15px 0;
            font-size: 1.4em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .multiple-persons-alert ul {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }

        .multiple-persons-alert li {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 5px;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            z-index: 1000;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            border: 3px solid #ff4757;
            max-width: 600px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .alert-banner.show {
            opacity: 1;
            visibility: visible;
            animation: alertPulse 0.5s ease-in-out;
        }

        @keyframes alertPulse {
            0% { transform: translateX(-50%) scale(0.9); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
    
        .match-photo-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .match-photo-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 150px;
        }

        .match-photo {
            width: 150px;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            background: #e9ecef;
        }

        .match-photo-label {
            margin-top: 7px;
            font-size: 0.85em;
            color: #666;
            text-align: center;
        }
        .match-photo-container {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .match-photo-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 150px;
        }

        .match-photo {
            width: 150px;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #dee2e6;
        }

        .match-photo-placeholder {
            width: 150px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            color: #666;
            border-radius: 10px;
            text-align: center;
            padding: 10px;
        }

        .match-photo-label {
            margin-top: 7px;
            font-size: 0.85em;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <h1>📹 Camera Detection</h1>
            <p>Real-time face detection and matching</p>
        </div>

        <!-- Alert Banner -->
        <div id="alertBanner" class="alert-banner"></div>

        <div class="nav">
            <a href="/">← Back to Upload</a>
            <a href="/targets">View Stored Persons</a>
        </div>

        <div class="content">

            <!-- Group Photo Upload Section -->
            <div class="section">

                <h2>Upload Photo</h2>

                <div class="controls">
                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        class="btn"
                    >

                    <button
                        class="btn btn-success"
                        id="detectFacesBtn"
                        disabled
                    >
                        Detect Faces
                    </button>
                </div>

                <div class="video-container" style="margin-top: 20px;">
                    <canvas
                        id="imageCanvas"
                        style="display: none; width: 100%; height: auto; cursor: crosshair;"
                    ></canvas>
                </div>

                <div id="cameraMessage" class="message"></div>

                <div id="cameraLoading" class="loading">
                    <div class="spinner"></div>
                    <p>Processing image...</p>
                </div>

                <div id="faceSelectionList" style="margin-top: 20px;"></div>

                <div class="controls">
                    <button
                        class="btn btn-success"
                        id="matchSelectedFaceBtn"
                        disabled
                    >
                        Search Selected Face
                    </button>
                </div>

            </div>

            <!-- Results Section -->
            <div class="section">

                <h2>Detection Results</h2>

                <div id="resultsContainer" class="matches-container">
                    <div class="empty-state">
                        Upload a group photo and select a face to search.
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>

    <script>
        const API_BASE_URL = window.location.origin;

        // ==========================================
        // GROUP PHOTO UPLOAD ELEMENTS
        // ==========================================

        const imageInput = document.getElementById('imageInput');
        const imageCanvas = document.getElementById('imageCanvas');
        const imageContext = imageCanvas.getContext('2d');

        const detectFacesBtn = document.getElementById('detectFacesBtn');
        const matchSelectedFaceBtn = document.getElementById('matchSelectedFaceBtn');

        const faceSelectionList = document.getElementById('faceSelectionList');
        const resultsContainer = document.getElementById('resultsContainer');
        const cameraLoading = document.getElementById('cameraLoading');

        let uploadedImage = null;
        let previewImage = null;

        let detectedFaces = [];
        let selectedFaceIndex = null;


        // ==========================================
        // EXISTING SOCKET.IO CONNECTION
        // PRESERVED FOR ALERT FUNCTIONALITY
        // ==========================================

        const socket = io(API_BASE_URL);

        socket.on('connect', function () {
            console.log('Connected to server');
        });

        socket.on('disconnect', function () {
            console.log('Disconnected from server');
        });

        socket.on('alert_triggered', function (data) {
            console.log('Alert triggered:', data);

            showAlert(data);
            playAlertSound();
        });


        // ==========================================
        // IMAGE UPLOAD AND PREVIEW
        // ==========================================

        imageInput.addEventListener('change', function () {

            const file = imageInput.files && imageInput.files[0];

            uploadedImage = null;
            previewImage = null;

            detectedFaces = [];
            selectedFaceIndex = null;

            detectFacesBtn.disabled = true;
            matchSelectedFaceBtn.disabled = true;

            faceSelectionList.innerHTML = '';

            resultsContainer.innerHTML =
                '<div class="empty-state">Select a face and search to see matching results.</div>';

            if (!file) {
                imageCanvas.style.display = 'none';
                return;
            }

            if (!file.type.startsWith('image/')) {

                imageInput.value = '';
                imageCanvas.style.display = 'none';

                showMessage(
                    'cameraMessage',
                    'Please select a valid image file.',
                    'error'
                );

                return;
            }

            uploadedImage = file;

            const imageUrl = URL.createObjectURL(file);
            const image = new Image();

            image.onload = function () {

                previewImage = image;

                imageCanvas.width = image.naturalWidth;
                imageCanvas.height = image.naturalHeight;

                imageCanvas.style.display = 'block';

                drawImageWithBoxes();

                detectFacesBtn.disabled = false;

                URL.revokeObjectURL(imageUrl);

                showMessage(
                    'cameraMessage',
                    'Photo uploaded successfully. Click Detect Faces.',
                    'success'
                );
            };

            image.onerror = function () {

                URL.revokeObjectURL(imageUrl);

                uploadedImage = null;
                imageInput.value = '';

                imageCanvas.style.display = 'none';

                showMessage(
                    'cameraMessage',
                    'Could not load this image. Please try another file.',
                    'error'
                );
            };

            image.src = imageUrl;
        });


        // ==========================================
        // DETECT ALL FACES IN GROUP PHOTO
        // ==========================================

        detectFacesBtn.addEventListener('click', async function () {

            if (!uploadedImage) {

                showMessage(
                    'cameraMessage',
                    'Please upload a group photo first.',
                    'error'
                );

                return;
            }

            detectFacesBtn.disabled = true;
            matchSelectedFaceBtn.disabled = true;

            cameraLoading.classList.add('show');

            detectedFaces = [];
            selectedFaceIndex = null;

            faceSelectionList.innerHTML = '';

            resultsContainer.innerHTML =
                '<div class="empty-state">Select a detected face to search the stored persons.</div>';

            try {

                const formData = new FormData();

                formData.append(
                    'image',
                    uploadedImage,
                    uploadedImage.name
                );

                const response = await fetch(
                    `${API_BASE_URL}/detect_faces`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Face detection failed.');
                }

                detectedFaces = data.faces || [];

                drawImageWithBoxes();

                renderFaceSelectionButtons();

                if (detectedFaces.length === 0) {

                    showMessage(
                        'cameraMessage',
                        'No faces were detected in this image.',
                        'info'
                    );

                    resultsContainer.innerHTML =
                        '<div class="empty-state">No faces detected in the uploaded image.</div>';

                } else {

                    showMessage(
                        'cameraMessage',
                        `Detected ${detectedFaces.length} face(s). Click a box or Face button to select one.`,
                        'success'
                    );
                }

            } catch (error) {

                console.error('Face detection error:', error);

                showMessage(
                    'cameraMessage',
                    `Error: ${error.message}`,
                    'error'
                );

            } finally {

                cameraLoading.classList.remove('show');
                detectFacesBtn.disabled = false;
            }
        });


        // ==========================================
        // DRAW IMAGE AND FACE BOUNDING BOXES
        // ==========================================

        function drawImageWithBoxes() {

            if (!previewImage) return;

            imageContext.clearRect(
                0,
                0,
                imageCanvas.width,
                imageCanvas.height
            );

            imageContext.drawImage(
                previewImage,
                0,
                0,
                imageCanvas.width,
                imageCanvas.height
            );

            detectedFaces.forEach(function (face) {

                const box = face.bbox;

                const selected =
                    face.face_index === selectedFaceIndex;

                const label =
                    face.label || `Face ${face.face_index + 1}`;

                const fontSize = Math.max(
                    18,
                    imageCanvas.width / 45
                );

                imageContext.lineWidth = Math.max(
                    3,
                    imageCanvas.width / 500
                );

                imageContext.strokeStyle = selected
                    ? '#ffcc00'
                    : '#00e676';

                imageContext.strokeRect(
                    box.x1,
                    box.y1,
                    box.x2 - box.x1,
                    box.y2 - box.y1
                );

                imageContext.font = `bold ${fontSize}px Arial`;

                const labelWidth =
                    imageContext.measureText(label).width + 16;

                const labelHeight = fontSize + 12;

                const labelY = Math.max(
                    0,
                    box.y1 - labelHeight
                );

                imageContext.fillStyle = selected
                    ? '#ffcc00'
                    : '#00e676';

                imageContext.fillRect(
                    box.x1,
                    labelY,
                    labelWidth,
                    labelHeight
                );

                imageContext.fillStyle = '#111';

                imageContext.fillText(
                    label,
                    box.x1 + 8,
                    labelY + fontSize
                );
            });
        }


        // ==========================================
        // CREATE FACE SELECTION BUTTONS
        // ==========================================

        function renderFaceSelectionButtons() {

            faceSelectionList.innerHTML = '';

            if (detectedFaces.length === 0) return;

            const heading = document.createElement('h3');

            heading.textContent = 'Select a face to search';
            heading.style.marginBottom = '12px';

            faceSelectionList.appendChild(heading);

            const buttonContainer = document.createElement('div');

            buttonContainer.style.display = 'flex';
            buttonContainer.style.flexWrap = 'wrap';
            buttonContainer.style.gap = '10px';

            detectedFaces.forEach(function (face) {

                const button = document.createElement('button');

                button.type = 'button';
                button.className = 'btn';

                button.textContent =
                    face.label || `Face ${face.face_index + 1}`;

                button.dataset.faceIndex = face.face_index;

                button.addEventListener('click', function () {
                    selectFace(face.face_index);
                });

                buttonContainer.appendChild(button);
            });

            faceSelectionList.appendChild(buttonContainer);
        }


        // ==========================================
        // SELECT A FACE
        // ==========================================

        function selectFace(faceIndex) {

            const faceExists = detectedFaces.some(
                face => face.face_index === faceIndex
            );

            if (!faceExists) return;

            selectedFaceIndex = faceIndex;

            matchSelectedFaceBtn.disabled = false;

            drawImageWithBoxes();

            faceSelectionList
                .querySelectorAll('button[data-face-index]')
                .forEach(function (button) {

                    const isSelected =
                        Number(button.dataset.faceIndex) === faceIndex;

                    button.style.outline = isSelected
                        ? '3px solid #28a745'
                        : 'none';
                });

            showMessage(
                'cameraMessage',
                `Face ${faceIndex + 1} selected. Click Search Selected Face.`,
                'info'
            );
        }


        // ==========================================
        // SELECT FACE BY CLICKING ITS BOUNDING BOX
        // ==========================================

        imageCanvas.addEventListener('click', function (event) {

            if (!previewImage || detectedFaces.length === 0) {
                return;
            }

            const rect = imageCanvas.getBoundingClientRect();

            const scaleX =
                imageCanvas.width / rect.width;

            const scaleY =
                imageCanvas.height / rect.height;

            const clickX =
                (event.clientX - rect.left) * scaleX;

            const clickY =
                (event.clientY - rect.top) * scaleY;

            const containingFaces = detectedFaces.filter(
                function (face) {

                    const box = face.bbox;

                    return (
                        clickX >= box.x1 &&
                        clickX <= box.x2 &&
                        clickY >= box.y1 &&
                        clickY <= box.y2
                    );
                }
            );

            if (containingFaces.length > 0) {

                // If boxes overlap, select the smallest containing box.
                containingFaces.sort(function (a, b) {

                    const areaA =
                        (a.bbox.x2 - a.bbox.x1) *
                        (a.bbox.y2 - a.bbox.y1);

                    const areaB =
                        (b.bbox.x2 - b.bbox.x1) *
                        (b.bbox.y2 - b.bbox.y1);

                    return areaA - areaB;
                });

                selectFace(containingFaces[0].face_index);
            }
        });


        // ==========================================
        // MATCH ONLY THE SELECTED FACE
        // ==========================================

        matchSelectedFaceBtn.addEventListener('click', async function () {

            if (!uploadedImage || selectedFaceIndex === null) {

                showMessage(
                    'cameraMessage',
                    'Please select a detected face first.',
                    'error'
                );

                return;
            }

            matchSelectedFaceBtn.disabled = true;

            cameraLoading.classList.add('show');

            try {

                const formData = new FormData();

                formData.append(
                    'image',
                    uploadedImage,
                    uploadedImage.name
                );

                formData.append(
                    'face_index',
                    String(selectedFaceIndex)
                );

                const response = await fetch(
                    `${API_BASE_URL}/match_selected_face`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.error || 'Selected face matching failed.'
                    );
                }

                displayMatches(
                    data.matches || [],
                    1
                );

                showMessage(
                    'cameraMessage',
                    data.message || 'Matching completed.',
                    data.best_match ? 'success' : 'info'
                );

            } catch (error) {

                console.error(
                    'Selected face matching error:',
                    error
                );

                resultsContainer.innerHTML =
                    `<div class="empty-state">${escapeHtml(error.message)}</div>`;

                showMessage(
                    'cameraMessage',
                    `Error: ${error.message}`,
                    'error'
                );

            } finally {

                cameraLoading.classList.remove('show');

                matchSelectedFaceBtn.disabled =
                    selectedFaceIndex === null;
            }
        });


        // ==========================================
        // DISPLAY MATCHES
        // EXISTING RESULTS FUNCTION PRESERVED
        // ==========================================

        function displayMatches(matches, facesDetected = 0) {

            const container = document.getElementById('resultsContainer');

            if (!matches || matches.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">
                        ${facesDetected > 0
                            ? `Detected ${facesDetected} face(s) but no matches found in database`
                            : 'No faces detected in the image'}
                    </div>
                `;

                return;
            }

            // Group matches by person name
            const matchesByPerson = {};

            matches.forEach(match => {
                if (!matchesByPerson[match.name]) {
                    matchesByPerson[match.name] = [];
                }

                matchesByPerson[match.name].push(match);
            });

            const uniquePersons = Object.keys(matchesByPerson);
            const personCount = uniquePersons.length;

            let html = `
                <div class="detection-summary">
                    Detected ${facesDetected} face(s), found ${personCount}
                    missing person${personCount > 1 ? 's' : ''}!
                </div>
            `;

            if (personCount > 1) {

                html += `
                    <div class="multiple-persons-alert">
                        <h3>🚨 MULTIPLE MISSING PERSONS FOUND 🚨</h3>
                        <p><strong>${personCount} missing persons detected:</strong></p>
                        <ul>
                `;

                uniquePersons.forEach(personName => {

                    const personMatches = matchesByPerson[personName];

                    const bestMatch = personMatches.reduce(
                        (best, current) =>
                            current.similarity > best.similarity ? current : best
                    );

                    html += `
                        <li>
                            <strong>${escapeHtml(personName)}</strong>
                            - ${escapeHtml(bestMatch.confidence)} confidence
                        </li>
                    `;
                });

                html += `</ul></div>`;
            }

            // Individual matched-person cards
            uniquePersons.forEach(personName => {

                const personMatches = matchesByPerson[personName];

                const bestMatch = personMatches.reduce(
                    (best, current) =>
                        current.similarity > best.similarity ? current : best
                );

                const registeredPhotoUrl = bestMatch.image_filename
                    ? `${API_BASE_URL}/uploads/${encodeURIComponent(bestMatch.image_filename)}`
                    : null;

                const photoHTML = registeredPhotoUrl
                    ? `
                        <div class="match-photo-column">
                            <img
                                class="match-photo"
                                src="${registeredPhotoUrl}"
                                alt="Registered photo of ${escapeHtml(personName)}"
                                onerror="
                                    this.style.display='none';
                                    this.nextElementSibling.style.display='flex';
                                "
                            >

                            <div class="match-photo-placeholder"
                                style="display:none;">
                                📷 Photo unavailable
                            </div>

                            <div class="match-photo-label">
                                Registered Photo
                            </div>
                        </div>
                    `
                    : `
                        <div class="match-photo-column">
                            <div class="match-photo-placeholder">
                                📷 No photo available
                            </div>

                            <div class="match-photo-label">
                                Registered Photo
                            </div>
                        </div>
                    `;

                html += `
                    <div class="match-item">

                        <h3>${escapeHtml(personName)}</h3>

                        <div class="match-photo-container">
                            ${photoHTML}
                        </div>

                        <div class="confidence">
                            Best Confidence: ${escapeHtml(bestMatch.confidence)}
                        </div>

                        <div class="details">

                            <strong>Similarity Score:</strong>
                            ${(bestMatch.similarity * 100).toFixed(2)}%

                            <br>

                            <strong>Face Index:</strong>
                            ${bestMatch.face_index !== undefined
                                ? bestMatch.face_index
                                : 'N/A'}

                            <br>

                            <strong>Added:</strong>
                            ${bestMatch.created_at
                                ? new Date(bestMatch.created_at).toLocaleString()
                                : 'N/A'}

                        </div>

                    </div>
                `;
            });

            container.innerHTML = html;
        }


        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(elementId, message, type) {

            const element =
                document.getElementById(elementId);

            element.textContent = message;

            element.className =
                `message ${type} show`;

            setTimeout(() => {

                element.classList.remove('show');

            }, 5000);
        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(text) {

            const div = document.createElement('div');

            div.textContent = text;

            return div.innerHTML;
        }


        // ==========================================
        // EXISTING ALERT FUNCTION PRESERVED
        // ==========================================

        function showAlert(data) {

            const alertBanner =
                document.getElementById('alertBanner');

            let personCount;
            let namesStr;

            if (data.multiple_persons) {

                personCount = data.person_count;

                const personNames = data.person_names;

                if (personCount === 2) {

                    namesStr =
                        `${personNames[0]} and ${personNames[1]}`;

                } else {

                    namesStr =
                        personNames.slice(0, -1).join(', ') +
                        ` and ${personNames[personNames.length - 1]}`;
                }

                alertBanner.innerHTML = `
                    🚨🚨 <strong>MULTIPLE ALERT:</strong>
                    ${personCount} missing persons found!<br>

                    <strong>${escapeHtml(namesStr)}</strong><br>

                    <small>
                        Time: ${new Date(data.timestamp).toLocaleString()}
                    </small>
                `;

                const detailsHtml = data.persons_found.map(person =>
                    `<div>
                        • ${escapeHtml(person.name)}: ${escapeHtml(person.confidence)}
                    </div>`
                ).join('');

                alertBanner.innerHTML +=
                    `<div style="margin-top: 10px; font-size: 0.9em;">
                        ${detailsHtml}
                    </div>`;

            } else {

                alertBanner.innerHTML = `
                    🚨 <strong>ALERT:</strong>
                    ${escapeHtml(data.person_name)} detected!<br>

                    <small>
                        Confidence: ${escapeHtml(data.confidence)}
                        | Time: ${new Date(data.timestamp).toLocaleString()}
                    </small>
                `;
            }

            alertBanner.classList.add('show');

            const duration =
                data.multiple_persons ? 15000 : 10000;

            setTimeout(() => {

                alertBanner.classList.remove('show');

            }, duration);


            // Browser notification - existing functionality preserved.
            if (
                'Notification' in window &&
                Notification.permission === 'granted'
            ) {

                const notificationTitle = data.multiple_persons
                    ? `Multiple Missing Persons Found (${personCount})`
                    : `Missing Person Found: ${data.person_name}`;

                const notificationBody = data.multiple_persons
                    ? `${namesStr} detected`
                    : `Confidence: ${data.confidence}`;

                new Notification(notificationTitle, {

                    body: notificationBody,

                    icon: '/static/alert-icon.png',

                    tag: 'missing-person-alert'
                });
            }
        }


        // ==========================================
        // EXISTING ALERT SOUND PRESERVED
        // ==========================================

        function playAlertSound() {

            try {

                const audioContext = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

                const oscillator =
                    audioContext.createOscillator();

                const gainNode =
                    audioContext.createGain();

                oscillator.connect(gainNode);

                gainNode.connect(audioContext.destination);

                oscillator.frequency.setValueAtTime(
                    800,
                    audioContext.currentTime
                );

                oscillator.frequency.setValueAtTime(
                    600,
                    audioContext.currentTime + 0.1
                );

                oscillator.frequency.setValueAtTime(
                    800,
                    audioContext.currentTime + 0.2
                );

                gainNode.gain.setValueAtTime(
                    0.3,
                    audioContext.currentTime
                );

                gainNode.gain.exponentialRampToValueAtTime(
                    0.01,
                    audioContext.currentTime + 0.5
                );

                oscillator.start(audioContext.currentTime);

                oscillator.stop(
                    audioContext.currentTime + 0.5
                );

            } catch (error) {

                console.log(
                    'Could not play alert sound:',
                    error
                );
            }
        }

    </script>
