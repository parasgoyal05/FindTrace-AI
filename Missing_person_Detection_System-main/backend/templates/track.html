<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Case | FindTrace</title><link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">FIND<span>TRACE</span> AI</a><div class="navlinks"><a href="/">Home</a><a href="/report">Report Person</a></div></nav><header class="pagehead"><div class="eyebrow">Case status</div><h1>Track your report</h1><p class="muted">Enter the Case ID provided after submitting a report.</p></header><section class="panel"><form id="trackForm" class="form"><div class="field full"><label>Case ID</label><input id="caseId" placeholder="e.g. FT-A1B2C3D4E5" required></div><div class="field full"><button class="btn primary">Find Case</button></div></form><div id="result" class="result"></div></section><footer class="footer"><a class="small-link" href="/">← Back to portal</a></footer></div>
<script>
const form=document.getElementById('trackForm'),out=document.getElementById('result'),field=document.getElementById('caseId');field.value=new URLSearchParams(location.search).get('case_id')||'';
form.addEventListener('submit',async e=>{e.preventDefault();out.style.display='block';out.textContent='Looking up case…';try{const id=encodeURIComponent(field.value.trim());const r=await fetch('/api/cases/track/'+id);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Could not find case');const c=d.case;const status=(c.status||'pending').toLowerCase();out.innerHTML='<div class="case-top"><div><div class="muted">Case ID</div><h2>'+c.case_id+'</h2><div class="muted">Person: '+escapeHtml(c.person_name)+'</div></div><span class="status '+status+'">'+status+'</span></div><p class="muted">Submitted: '+(c.submitted_at?new Date(c.submitted_at).toLocaleString():'—')+'</p>'+(c.reviewed_at?'<p class="muted">Reviewed: '+new Date(c.reviewed_at).toLocaleString()+'</p>':'')+(c.review_note?'<p>Admin note: '+escapeHtml(c.review_note)+'</p>':'')+'<p class="muted">Reporter contact details are not displayed on public tracking.</p>'}catch(err){out.innerHTML='<span class="error">'+escapeHtml(err.message)+'</span>'}});
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
